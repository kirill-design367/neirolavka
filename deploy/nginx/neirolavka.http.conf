# ПЕРВЫЙ ЭТАП: сайт по http, сертификата ещё нет.
#
# Нужен ровно затем, чтобы (а) сайт можно было открыть и проверить
# по IP до переезда DNS и (б) Let's Encrypt смог положить и забрать
# проверочный файл в /.well-known/acme-challenge/.
#
# Как только сертификат выпущен, scripts/server-tls.sh подменяет этот
# файл на боевой neirolavka.conf.

server {
    listen 80 default_server;
    include /etc/nginx/snippets/neirolavka-listen6-80.conf;

    server_name _;
    root /var/www/neirolavka/current;

    # Проверочные файлы Let's Encrypt отдаются из отдельной папки,
    # а не из выдачи сайта: выдача подменяется целиком при каждой
    # выкладке, и файл проверки исчез бы посреди выпуска.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
        try_files $uri =404;
    }

    include /etc/nginx/snippets/neirolavka-zagolovki.conf;
    include /etc/nginx/snippets/neirolavka-static.conf;
}
