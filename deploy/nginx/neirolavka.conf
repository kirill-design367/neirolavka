# БОЕВАЯ конфигурация: сертификат выпущен, домен смотрит сюда.
# Ставится скриптом scripts/server-tls.sh вместо neirolavka.http.conf.
#
# Правило переходов: КУДА БЫ человек ни пришёл, он попадает на
# https://neirolavka.ru ЗА ОДИН ШАГ. Цепочек нет ни одной:
#
#   http://neirolavka.ru/X       → 301 https://neirolavka.ru/X
#   http://www.neirolavka.ru/X   → 301 https://neirolavka.ru/X   (сразу, не через https://www)
#   https://www.neirolavka.ru/X  → 301 https://neirolavka.ru/X
#   https://neirolavka.ru/X      → 200
#
# Соблазн написать в http-блоке `return 301 https://$host$request_uri`
# велик и ошибочен: с www это дало бы http://www → https://www →
# https://без-www, то есть два шага вместо одного.

# ─── Чужой Host и голый IP ─────────────────────────────────────────
# Без этого сайт открывался бы по адресу 5.42.123.35 и по любому
# чужому домену, наведённому на наш адрес.
server {
    listen 80 default_server;
    include /etc/nginx/snippets/neirolavka-listen6-80.conf;
    server_name _;

    # Проверку Let's Encrypt пускаем всегда: продление ходит по имени,
    # но лишняя строгость тут стоит просроченного сертификата.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 444;
    }
}

server {
    listen 443 ssl default_server;
    include /etc/nginx/snippets/neirolavka-listen6-443.conf;
    include /etc/nginx/snippets/neirolavka-http2.conf;
    server_name _;
    # Рукопожатие отклоняется на месте: сертификата для чужого имени
    # у нас нет, и подсовывать свой незачем.
    ssl_reject_handshake on;
}

# ─── http: оба имени уходят на https без www одним шагом ───────────
server {
    listen 80;
    include /etc/nginx/snippets/neirolavka-listen6-80.conf;
    server_name neirolavka.ru www.neirolavka.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://neirolavka.ru$request_uri;
    }
}

# ─── https с www: один шаг на канонический адрес ───────────────────
server {
    listen 443 ssl;
    include /etc/nginx/snippets/neirolavka-listen6-443.conf;
    include /etc/nginx/snippets/neirolavka-http2.conf;
    server_name www.neirolavka.ru;

    include /etc/nginx/snippets/neirolavka-tls.conf;

    return 301 https://neirolavka.ru$request_uri;
}

# ─── https без www: сам сайт ───────────────────────────────────────
server {
    listen 443 ssl;
    include /etc/nginx/snippets/neirolavka-listen6-443.conf;
    include /etc/nginx/snippets/neirolavka-http2.conf;
    server_name neirolavka.ru;

    include /etc/nginx/snippets/neirolavka-tls.conf;

    # Корень — СИМВОЛИЧЕСКАЯ ССЫЛКА на текущий выпуск. Подмена ссылки
    # и есть выкладка: nginx разбирает её на каждом запросе, поэтому
    # перезагружать его не нужно и полуразложенной выдачи не бывает.
    # По этой же причине здесь нет open_file_cache — он запомнил бы
    # старый путь.
    root /var/www/neirolavka/current;

    # Весь набор заголовков — одним include и ровно один раз:
    # add_header в location заменил бы его целиком.
    include /etc/nginx/snippets/neirolavka-zagolovki.conf;
    # Без includeSubDomains и без preload намеренно: и то и другое
    # отменяется месяцами, а поддомены под бота ещё не заведены.
    add_header Strict-Transport-Security "max-age=31536000" always;

    include /etc/nginx/snippets/neirolavka-static.conf;
}
