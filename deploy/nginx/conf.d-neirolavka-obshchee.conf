# Общие настройки http. Кладётся в /etc/nginx/conf.d/neirolavka-obshchee.conf.
#
# ЗДЕСЬ ЖИВЁТ ВСЯ НАСТРОЙКА, КОТОРОЙ МЫ ВЛАДЕЕМ. Всё, что перечислено
# ниже, скрипт server-setup.sh предварительно ГАСИТ в стандартном
# /etc/nginx/nginx.conf — комментирует строку и подписывает, куда
# настройка переехала.
#
# Почему так, а не «не объявлять то, что уже объявлено». Второй путь
# ставит правильность нашего файла в зависимость от содержимого чужого,
# который мы не контролируем и который меняется от версии к версии
# дистрибутива. Хуже того, он делает настройку невидимой: `gzip on`
# работал бы строкой, которой нет в нашем репозитории, — и если её
# однажды закомментируют, сжатие тихо отключится, а узнаем мы об этом
# по просевшим баллам через месяц. Когда настройка живёт в одном месте,
# её нельзя случайно поломать правкой в другом.
#
# На этом уже обожглись: `gzip on;` стоит в стандартном nginx.conf
# Ubuntu 24.04 на строке 46, файлы из conf.d подключаются в тот же
# блок http, и nginx падал с «"gzip" directive is duplicate».

# ─── Сжатие ────────────────────────────────────────────────────────
# gzip_static включён не просто так: выкладка кладёт рядом с каждым
# текстовым файлом готовый .gz, сжатый девятым уровнем. nginx отдаёт
# его как есть — это и плотнее, чем сжатие на лету, и дешевле по
# процессору. gzip on оставлен на случай файлов, для которых пары
# не нашлось.
gzip              on;
gzip_static       on;
gzip_vary         on;
gzip_comp_level   6;
gzip_min_length   1024;
gzip_proxied      any;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/manifest+json
    image/svg+xml
    font/ttf;
# woff2 уже сжат внутри — второй проход только тратит процессор.

# ─── Версия сервера наружу не выдаётся ─────────────────────────────
server_tokens     off;

# ─── TLS: общая часть для всех блоков ──────────────────────────────
# Стандартный nginx.conf объявляет ssl_protocols с TLSv1 и TLSv1.1 —
# протоколами, от которых браузеры отказались. Раз мы всё равно эту
# строку гасим, забираем настройку целиком и ставим здесь, на уровне
# http: так её наследует КАЖДЫЙ блок, включая тот, что отклоняет
# рукопожатия чужим именам.
ssl_protocols             TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
# Кеш сессий — общий на весь сервер, поэтому объявлен один раз здесь,
# а не в каждом блоке server по отдельности.
ssl_session_timeout       1d;
ssl_session_cache         shared:NEIRO:10m;
ssl_session_tickets       off;

# ─── Ограничение частоты входа в панель ────────────────────────────
# Вторая линия против перебора пароля, независимая от первой.
#
# В базе стоит замок по ЛОГИНУ: пять неудач подряд — и учётка заперта
# с удваивающейся паузой. Перебирающий это обходит, меняя логин
# в каждом запросе, и тогда каждая попытка стоит нам одного scrypt —
# шестнадцати мегабайт и десятков миллисекунд процессора. Сотня
# запросов в секунду положила бы этим машину с двумя ядрами, даже
# не подобрав пароля.
#
# Поэтому здесь — предел по АДРЕСУ: десять попыток в минуту, всплеск
# до пяти без задержки. Живому человеку, набирающему пароль с ошибкой,
# этого хватает с запасом; перебор становится бессмысленным.
# Зона общая на весь http, 1 МБ — это около 16 тысяч адресов.
limit_req_zone $binary_remote_addr zone=neiro_vhod:1m rate=10r/m;

# Проверка промокода с сайта. Своя зона, а не общая со входом: у входа
# десять попыток в минуту — человеку, набирающему пароль, этого хватает,
# а человеку, пробующему промокоды из письма и с картинки, уже нет.
#
# Предел тут не от нагрузки (запрос дешёвый — одно чтение по первичному
# ключу), а от ПЕРЕБОРА: без него код из восьми знаков вылавливается
# скриптом за ночь. Тридцать в минуту со всплеском до десяти — заведомо
# больше, чем наберёт руками живой человек, и заведомо мало для перебора.
limit_req_zone $binary_remote_addr zone=neiro_promo:1m rate=30r/m;

# Заведение заказа с сайта.
#
# Предел мягче, чем у промокода, и это намеренно: за каждым запросом
# стоит человек, который сейчас пойдёт платить, а лишний отказ здесь —
# это не защита, а потерянная продажа. Совсем без предела нельзя:
# каждый запрос заводит СТРОКУ В БАЗЕ и может потратить активацию
# промокода, то есть дешёвый перебор превратился бы в мусор в очереди
# и в сожжённые чужие скидки. Ключ нажатия от этого не спасает —
# его придумывает та же сторона, что и перебирает.
limit_req_zone $binary_remote_addr zone=neiro_zakaz:1m rate=20r/m;

# ─── Кеш ───────────────────────────────────────────────────────────
# Правило кеша считается ЗДЕСЬ, а не в location, и это не стиль.
#
# add_header внутри location не дополняет заголовки сервера, а ПОЛНОСТЬЮ
# их заменяет. Пока Cache-Control стоял в location по расширению, любая
# html-страница теряла заголовки безопасности, объявленные на уровне
# server: проверка показала, что X-Content-Type-Options, Referrer-Policy
# и X-Frame-Options до главной не доезжают вовсе. Через map значение
# вычисляется по адресу, add_header остаётся ровно один на весь server,
# и заменять нечего.
map $uri $neiro_kesh {
    # Имена в _next/static содержат хеш содержимого: файл с таким
    # именем уже никогда не изменится, его можно держать вечно.
    ~^/_next/static/    "public, max-age=31536000, immutable";
    ~\.woff2$           "public, max-age=31536000, immutable";
    ~^/icon\.svg$       "public, max-age=86400";
    # Всё остальное — html и txt. Их кешировать нельзя: после выкладки
    # человек увидел бы старую страницу со ссылками на удалённые куски.
    default             "no-cache";
}
