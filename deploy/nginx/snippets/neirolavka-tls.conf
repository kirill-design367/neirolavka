# Общая часть TLS для обоих https-блоков.
ssl_certificate         /etc/letsencrypt/live/neirolavka.ru/fullchain.pem;
ssl_certificate_key     /etc/letsencrypt/live/neirolavka.ru/privkey.pem;
ssl_trusted_certificate /etc/letsencrypt/live/neirolavka.ru/chain.pem;

ssl_session_timeout     1d;
ssl_session_cache       shared:NEIRO:10m;
ssl_session_tickets     off;

ssl_protocols           TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

# Ответ о непросроченности сертификата сервер берёт сам и кладёт
# в рукопожатие: браузеру не нужно ходить к удостоверяющему центру,
# и первый байт приходит быстрее.
ssl_stapling            on;
ssl_stapling_verify     on;
resolver                127.0.0.53 valid=300s;
resolver_timeout        5s;
