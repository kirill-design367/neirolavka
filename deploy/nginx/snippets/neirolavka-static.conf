# Отдача статики: маршруты и своя страница 404.
# Включается и в конфигурацию первого этапа (до сертификата), и
# в боевую, чтобы правила не разъезжались между ними.
#
# Заголовков здесь НЕТ намеренно: они объявлены один раз на уровне
# server. add_header в location заменил бы их целиком — см. пояснение
# в conf.d-neirolavka-szhatie.conf.

index index.html;

# Выдача Next собрана с trailingSlash: true — это папки с index.html.
#
# Второе звено — именно $uri/index.html, а не $uri/. С $uri/ папка без
# index.html (а такая одна — /_next/) отдавалась как 403 Forbidden:
# каталог существует, показывать в нём нечего, листинг выключен.
# Ответ 403 на несуществующий адрес — лишний сигнал о том, что такая
# папка есть; пусть будет обычное 404, как у любого другого промаха.
location / {
    try_files $uri $uri/index.html =404;
}

# Своя страница 404, а не служебная страница nginx. В выдаче она лежит
# как 404.html; check-export следит, чтобы это была наша страница,
# а не готовая английская из Next.
error_page 404 /404.html;
location = /404.html {
    internal;
}

# Вебхуки бота включаются НАЛИЧИЕМ ФАЙЛА, а не правкой этой строки.
# Маска, не совпавшая ни с одним файлом, для nginx не ошибка, поэтому
# «включено» и «выключено» различаются существованием
# snippets/neirolavka-bot-vkl.conf — его кладёт scripts/bot-setup.sh.
#
# Так сделано ради идемпотентности: раскомментированная строка
# в репозитории включала бы вебхуки на любом сервере, где бота нет,
# и /bot-health отвечал бы 502 вместо 404.
include /etc/nginx/snippets/neirolavka-bot-vkl*.conf;
