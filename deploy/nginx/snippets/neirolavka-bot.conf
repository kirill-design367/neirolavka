# Что уходит боту: вебхуки Telegram, уведомления Робокассы,
# проба живости и админ-панель.
#
# Включается НАЛИЧИЕМ ФАЙЛА, а не правкой строки: этот файл
# подключается через snippets/neirolavka-bot-vkl.conf, который кладёт
# scripts/bot-setup.sh. Раскомментированная строка в репозитории
# включала бы вебхуки на любом сервере, где бота нет.
#
# Бот слушает ТОЛЬКО петлю (127.0.0.1). Наружу его порт не открыт —
# в файрволе разрешены только 22, 80 и 443, и открывать 8080 не нужно:
# и вебхуки, и панель приходят на 443 и проксируются сюда.

# Вебхук Telegram. Путь заканчивается секретом, который знает только
# бот и Telegram: адрес вебхука сам по себе и есть пароль. Секрет
# лежит в /etc/neirolavka-bot/okruzhenie под root, а не здесь.
location ^~ /tg/ {
    proxy_pass              http://127.0.0.1:8080;
    proxy_http_version      1.1;
    proxy_set_header        Host              $host;
    proxy_set_header        X-Real-IP         $remote_addr;
    proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_read_timeout      30s;
    # Telegram шлёт небольшие JSON; больше мегабайта — это не вебхук.
    client_max_body_size    1m;
    access_log              /var/log/nginx/neirolavka-bot.log;
}

# РОБОКАССА: три пути, и роли у них разные.
#
#   /robokassa/result    — сервер Робокассы сообщает об оплате.
#                          ТОЛЬКО ЭТОТ путь меняет состояние заказа.
#                          Подпись проверяет сам бот паролем № 2;
#                          nginx только доносит запрос неизменным.
#   /robokassa/uspeh     — сюда возвращается ЧЕЛОВЕК после оплаты.
#   /robokassa/neudacha  — и сюда, если оплата не прошла.
#
# Одним префиксом, а не тремя точными совпадениями: пути отличаются
# последним куском, проксируются одинаково, и три копии одного блока
# разъехались бы при первой правке.
#
# Предела частоты здесь НЕТ намеренно. Уведомление приходит от сервера
# Робокассы, а не от браузера человека; отбросив его по частоте,
# мы заставили бы Робокассу повторять, а заказ — висеть неоплаченным.
# От подделки защищает подпись, а не счётчик запросов.
location ^~ /robokassa/ {
    proxy_pass              http://127.0.0.1:8080;
    proxy_http_version      1.1;
    proxy_set_header        Host              $host;
    proxy_set_header        X-Real-IP         $remote_addr;
    proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_read_timeout      30s;
    # Уведомление — десяток коротких полей. Мегабайта тут не бывает.
    client_max_body_size    64k;
    access_log              /var/log/nginx/neirolavka-bot.log;
}

# Проверка промокода с сайта.
#
# Сайт статический и базы не видит: чтобы показать в чеке «исходная
# цена — скидка — итого», ему нужно спросить у того, кто знает. Ответ
# при этом предварительный — настоящее решение принимает база в момент
# создания заказа.
#
# Предел частоты здесь ОБЯЗАТЕЛЕН: без него код из восьми знаков
# вылавливается перебором. Своя зона, не общая со входом в панель —
# у того предел вдесятеро строже и рассчитан на другое.
location = /api/promo {
    limit_req               zone=neiro_promo burst=10 nodelay;

    proxy_pass              http://127.0.0.1:8080;
    proxy_http_version      1.1;
    proxy_set_header        Host              $host;
    proxy_set_header        X-Real-IP         $remote_addr;
    proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_read_timeout      10s;
    client_max_body_size    1k;
    access_log              /var/log/nginx/neirolavka-bot.log;
}

# Заказ с сайта: единственный путь, которым витрина заводит заказ.
#
# Сам сайт по-прежнему ничего не хранит и ничего не решает — он
# собирает выбор человека и спрашивает бота. Заказ, активация
# промокода и счёт Робокассы живут там же, где жили всегда.
location = /api/zakaz {
    limit_req               zone=neiro_zakaz burst=5 nodelay;

    proxy_pass              http://127.0.0.1:8080;
    proxy_http_version      1.1;
    proxy_set_header        Host              $host;
    proxy_set_header        X-Real-IP         $remote_addr;
    proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    # Дольше, чем у промокода: здесь пишется база и собирается подпись.
    proxy_read_timeout      20s;
    client_max_body_size    4k;
    access_log              /var/log/nginx/neirolavka-bot.log;
}

# Проба живости бота — для мониторинга, наружу отдаёт только «жив/нет».
location = /bot-health {
    proxy_pass              http://127.0.0.1:8080/health;
    access_log              off;
}

# ─────────────────────────────────────────────────────────────────────
# Админ-панель: neirolavka.ru/admin
#
# Путь на основном домене, а не поддомен: сертификат уже выпущен
# на neirolavka.ru, отдельное имя потребовало бы второго сертификата
# и второго блока server ради того же самого.
#
# Панель живёт в ЭТОМ ЖЕ процессе бота и на том же порту петли.
# Наружу 8080 по-прежнему закрыт файрволом; единственная дверь — 443.
# ─────────────────────────────────────────────────────────────────────

# ЗАГОЛОВКИ ЗДЕСЬ СВОИ, И ЭТО ГЛАВНОЕ В ЭТОМ БЛОКЕ.
#
# add_header не дополняет набор сервера, а ЗАМЕНЯЕТ его — и здесь
# это ровно то, что нужно. Без своего add_header панель получила бы
# заголовки сайта поверх собственных: `X-Frame-Options: SAMEORIGIN`
# от сервера рядом с `DENY` от панели и `Cache-Control: no-cache`
# рядом с `no-store`. Два разных значения одного заголовка браузеры
# разбирают кто во что горазд — а на страницах панели лежат чужие
# логины и пароли, и «кеширование по усмотрению» тут недопустимо.
#
# Всё остальное — no-store, DENY, политику содержимого, nosniff,
# no-referrer — панель ставит сама: они должны быть верны и тогда,
# когда её открывают не через nginx.
location ^~ /admin {
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    proxy_pass              http://127.0.0.1:8080;
    proxy_http_version      1.1;
    proxy_set_header        Host              $host;
    proxy_set_header        X-Real-IP         $remote_addr;
    proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    # Действие панели может ждать ответа Telegram (уведомление
    # покупателю), а у клиента к Telegram свой предел в 10 с плюс
    # повторы при обрыве. Тридцати хватает с запасом.
    proxy_read_timeout      30s;
    client_max_body_size    1m;
    access_log              /var/log/nginx/neirolavka-panel.log;
}

# Вход — отдельным точным совпадением ради предела частоты.
#
# Точное совпадение (= /admin/vhod) старше префикса выше, поэтому
# проксирование приходится повторить: nginx не наследует его между
# соседними location. Зато перебор упирается в предел ДО того, как
# запрос дойдёт до scrypt.
location = /admin/vhod {
    limit_req               zone=neiro_vhod burst=5 nodelay;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    proxy_pass              http://127.0.0.1:8080;
    proxy_http_version      1.1;
    proxy_set_header        Host              $host;
    proxy_set_header        X-Real-IP         $remote_addr;
    proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_read_timeout      30s;
    client_max_body_size    16k;
    access_log              /var/log/nginx/neirolavka-panel.log;
}
