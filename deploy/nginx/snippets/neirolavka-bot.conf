# ЗАГОТОВКА ПОД БОТА. Никуда не включена — бота ещё нет.
#
# Чтобы включить: раскомментировать строку include в
# snippets/neirolavka-static.conf, поднять бота на 127.0.0.1:8080
# и сделать `sudo nginx -t && sudo systemctl reload nginx`.
#
# Бот слушает ТОЛЬКО петлю (127.0.0.1). Наружу его порт не открыт —
# в файрволе разрешены только 22, 80 и 443, и открывать 8080 не нужно:
# вебхуки приходят на 443 и проксируются сюда.

# Вебхук Telegram. Путь заканчивается секретом, который знает только
# бот и Telegram: адрес вебхука сам по себе и есть пароль. Секрет
# лежит в /home/bot/neirolavka-bot/.env, а не здесь.
location ^~ /tg/ {
    proxy_pass              http://127.0.0.1:8080;
    proxy_http_version      1.1;
    proxy_set_header        Host              $host;
    proxy_set_header        X-Real-IP         $remote_addr;
    proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_read_timeout      30s;
    # Telegram шлёт небольшие JSON; больше мегабайта — это не вебхук.
    client_max_body_size    1m;
    access_log              /var/log/nginx/neirolavka-bot.log;
}

# Уведомления ЮKassa о платежах. Подпись проверяет сам бот; nginx
# только доносит тело запроса неизменным.
location = /yookassa {
    proxy_pass              http://127.0.0.1:8080/yookassa;
    proxy_http_version      1.1;
    proxy_set_header        Host              $host;
    proxy_set_header        X-Real-IP         $remote_addr;
    proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_read_timeout      30s;
    client_max_body_size    1m;
    access_log              /var/log/nginx/neirolavka-bot.log;
}

# Проба живости бота — для мониторинга, наружу отдаёт только «жив/нет».
location = /bot-health {
    proxy_pass              http://127.0.0.1:8080/health;
    access_log              off;
}
