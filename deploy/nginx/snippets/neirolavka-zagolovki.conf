# Заголовки ответа. Объявляются РОВНО ОДИН РАЗ на уровне server:
# add_header в location заменяет весь набор, а не дополняет его.
# Значение Cache-Control приходит из map в conf.d.
add_header Cache-Control          $neiro_kesh always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
add_header X-Frame-Options        "SAMEORIGIN" always;
