name: Проверка боевого адреса браузером

# check-live.mjs смотрит на ответы сервера. Этого мало, чтобы сказать
# «сайт работает так же, как раньше»: витрина, пузыри, темы, выбор
# тарифов и чек живут в JavaScript, и проверить их можно только
# настоящим браузером на настоящем адресе.
#
# Из контейнера разработки боевой адрес недоступен — сеть закрыта
# политикой шлюза. Поэтому те же самые проверки гоняются здесь.
#
# ЗАПУСКАЕТСЯ ПОСЛЕ ВЫКЛАДКИ, а не вместе с ней.
#
# Раньше стоял тот же триггер, что у выкладки, — push в main. Оба
# прогона стартовали от одного пуша и шли одновременно: браузер
# открывал боевой адрес ровно в те секунды, когда выкладка подменяла
# ссылку current. Страница приходила из одного выпуска, кусок скрипта
# запрашивался уже из другого, и его там не было:
#
#   404 https://neirolavka.ru/_next/static/chunks/1p74cbb2a3146.js
#   Refused to execute script ... MIME type ('text/html')
#
# Подмена сама по себе атомарная (mv -T над символической ссылкой),
# но между запросом страницы и запросом её кусков проходит время,
# и попасть в него — вопрос везения. Прогон краснел на исправном
# сайте, а красный, который иногда врёт, перестают читать.
#
# Поэтому проверка ждёт выкладку через workflow_run и стартует только
# после её УСПЕШНОГО завершения. Условие в job обязательно: без него
# workflow_run срабатывает и на упавшую выкладку, и проверка пошла бы
# смотреть на сайт, которого туда не доехало.
#
# workflow_run читается только с ветки по умолчанию. У репозитория это
# main — проверено, — но если ветку по умолчанию когда-нибудь сменят,
# триггер замолчит целиком и незаметно. Признак: выкладка зелёная,
# а проверки браузером за ней нет вовсе.

# Триггера по push здесь больше НЕТ, и это не упрощение.
#
# Он стоял ради важного: «проверку починили, запушили — и узнать,
# починилась ли она, нечем, пока кто-нибудь не тронет файл прогона».
# Но выкладка запускается на ЛЮБОЙ пуш в main — фильтра по путям
# у неё нет вовсе, — значит правка проверки запускает и её тоже,
# и push-триггер возвращал ровно ту гонку, от которой мы уходим.
#
# Терять при этом нечего: раз выкладка идёт на каждый пуш, а проверка
# идёт за каждой выкладкой, она и так прогоняется после каждого пуша
# в main — только теперь в правильном порядке.

on:
  workflow_run:
    workflows: ['Сборка и выкладка на боевой сервер']
    types: [completed]
  workflow_dispatch:
    inputs:
      adres:
        description: 'Какой адрес проверять'
        default: 'https://neirolavka.ru/'
        required: false

jobs:
  proverka:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Пришли по следам выкладки — идём только за успешной. Пришли
    # по правке проверки или кнопкой — идём всегда.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    env:
      ADRES: ${{ inputs.adres || 'https://neirolavka.ru/' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Браузер
        # Скрипты берут путь из CHROME_PATH, а по умолчанию смотрят туда,
        # где браузер лежит в контейнере разработки. Здесь его ставит
        # сам Playwright и говорит, куда положил.
        run: |
          npx playwright install --with-deps chromium
          echo "CHROME_PATH=$(node -e "console.log(require('playwright').chromium.executablePath())")" >> "$GITHUB_ENV"
          echo "браузер: $(node -e "console.log(require('playwright').chromium.executablePath())")"

      - name: Живая страница — запросы, консоль, CLS
        run: node scripts/verify-live.mjs "$ADRES"

      - name: Разрешения — ничего не вылезает за экран
        run: node scripts/check-viewports.mjs "$ADRES"

      - name: Витрина — геометрия, выбор тарифа, чек, плоский запасной вид
        run: node scripts/check-shelf.mjs "$ADRES"

      - name: Витрина — кромка холста теней и ряд кадров перехода
        run: node scripts/check-shelf-motion.mjs "$ADRES"

      - name: Витрина — чёткость текста против той же карточки вне сцены
        run: node scripts/check-card-sharpness.mjs "$ADRES"

      - name: Отзывы — стык ленты, остановка под курсором, листание
        run: node scripts/check-reviews.mjs "$ADRES"

      - name: Пузыри — число, отклик, лопание, отложенность
        run: node scripts/check-bubbles.mjs "$ADRES"

      - name: Темы — вспышка при загрузке и prefers-reduced-motion
        run: node scripts/check-theme-motion.mjs "$ADRES"

      - name: Контраст в обеих темах
        run: node scripts/check-contrast.mjs "$ADRES"

      - name: Панель заказа — кнопка видна на всех высотах
        run: node scripts/check-order-panel.mjs "$ADRES"

      - name: Ссылки в бот и честность текстов про оплату
        # SET_DO_TELEGRAM включает пробу живого ответа t.me: из
        # контейнера разработки шлюз туда не пускает, а отсюда пускает.
        env:
          SET_DO_TELEGRAM: '1'
        run: node scripts/check-bot-links.mjs "$ADRES"
