name: Сборка и выкладка на боевой сервер

# Пуш в main → сборка → выкладка по SSH на VPS.
#
# Секреты, которые должны быть заведены в настройках репозитория:
#   SSH_PRIVATE_KEY  — закрытый ключ пользователя deploy. Его печатает
#                      scripts/server-setup.sh один раз при первом
#                      запуске. Ключ root сюда не кладётся никогда.
#   SSH_KNOWN_HOSTS  — строка из ssh-keyscan для адреса сервера. Без неё
#                      пришлось бы отключать проверку хоста, а это
#                      согласие подключиться к кому угодно.
# Переменные (Settings → Variables), необязательные:
#   DEPLOY_HOST, DEPLOY_USER, DEPLOY_ROOT, SITE_URL

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      proba_otkata:
        description: 'УЧЕНИЕ: испортить выдачу перед заливкой и убедиться, что откат работает'
        type: boolean
        default: false

# Две выкладки одновременно подменяли бы ссылку current наперегонки.
concurrency:
  group: vykladka
  cancel-in-progress: false

env:
  HOST: ${{ vars.DEPLOY_HOST || '5.42.123.35' }}
  USER: ${{ vars.DEPLOY_USER || 'deploy' }}
  KOREN: ${{ vars.DEPLOY_ROOT || '/var/www/neirolavka' }}
  SAYT: ${{ vars.SITE_URL || 'https://neirolavka.ru' }}
  # Сколько прошлых выпусков держать на сервере — на случай отката.
  HRANIT: 3

jobs:
  sborka-i-vykladka:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Проверка типов
        run: npx tsc --noEmit

      - name: Сборка статического экспорта
        # Ни basePath, ни assetPrefix: сайт живёт в корне своего домена.
        run: npm run build

      - name: Проверка выдачи
        run: node scripts/check-export.mjs out

      - name: Сжатие текстовых файлов заранее
        # nginx настроен с gzip_static: если рядом с файлом лежит .gz,
        # он отдаёт готовый. Сжать один раз здесь девятым уровнем
        # дешевле и плотнее, чем жать каждый запрос на сервере.
        run: |
          find out -type f \
            \( -name '*.html' -o -name '*.css' -o -name '*.js' \
               -o -name '*.json' -o -name '*.svg' -o -name '*.txt' \) \
            -size +1k -print0 | xargs -0 -r -P4 gzip -9 -k -f
          echo "сжато файлов: $(find out -name '*.gz' | wc -l)"

      - name: Есть ли доступ к серверу
        id: dostup
        env:
          KLYUCH: ${{ secrets.SSH_PRIVATE_KEY }}
          HOSTY: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          # Пока сервер не поднят, секретов нет, и выкладывать некуда.
          # Красить прогон в красный за это неправильно: сборка и проверка
          # выдачи прошли, а отсутствие сервера — не поломка кода. Как
          # только секреты появятся, все шаги ниже станут обязательными
          # и любая их неудача покрасит прогон.
          if [ -n "$KLYUCH" ] && [ -n "$HOSTY" ]; then
            echo "est=да" >> "$GITHUB_OUTPUT"
          else
            echo "est=нет" >> "$GITHUB_OUTPUT"
            echo "::notice::Секретов SSH_PRIVATE_KEY и SSH_KNOWN_HOSTS ещё нет — выкладка пропущена. Их печатает scripts/server-setup.sh при первом запуске на сервере."
          fi

      - name: Ключ и известный хост
        if: steps.dostup.outputs.est == 'да'
        env:
          KLYUCH: ${{ secrets.SSH_PRIVATE_KEY }}
          HOSTY: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KLYUCH" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$HOSTY" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host cel
            HostName $HOST
            User $USER
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ConnectTimeout 20
          EOF
          chmod 600 ~/.ssh/config
          # Сначала говорим понятно, потом даём ssh ругаться непонятно.
          # «Host key verification failed» не подсказывает, что именно
          # не так с секретом, а вариантов ровно два: пусто или ключ
          # записан для другого адреса.
          if ! ssh-keygen -F "$HOST" -f ~/.ssh/known_hosts > /dev/null 2>&1; then
            echo "::error::В секрете SSH_KNOWN_HOSTS нет ключа для $HOST. Строк в секрете: $(grep -c . ~/.ssh/known_hosts). Получить правильную строку на сервере: for T in ed25519 rsa; do awk -v ip=$HOST '{print ip, \$1, \$2}' /etc/ssh/ssh_host_\${T}_key.pub; done"
            exit 1
          fi
          echo "известный хост найден: $(ssh-keygen -F "$HOST" -f ~/.ssh/known_hosts | grep -c '^[^#]')"
          ssh cel 'echo подключение есть: $(whoami)@$(hostname)'

      - name: Имя выпуска
        if: steps.dostup.outputs.est == 'да'
        id: vypusk
        run: echo "imya=$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Куда смотрит домен
        if: steps.dostup.outputs.est == 'да'
        id: domen
        # Считаем ОДИН раз и до заливки: от этого зависят и наблюдение
        # за непрерывностью, и публичная проверка боем в конце.
        run: |
          adresa=$(getent ahostsv4 neirolavka.ru 2>/dev/null | awk '{print $1}' | sort -u | tr '\n' ' ')
          echo "neirolavka.ru → ${adresa:-ничего}"
          if echo " $adresa " | grep -q " $HOST "; then
            echo "nash=да" >> "$GITHUB_OUTPUT"
          else
            echo "nash=нет" >> "$GITHUB_OUTPUT"
            echo "::notice::Домен смотрит не на $HOST — наблюдение за выкладкой и проверка боем пропущены."
          fi

      - name: Наблюдение за непрерывностью — старт
        if: steps.dostup.outputs.est == 'да' && steps.domen.outputs.nash == 'да'
        # Пока идёт заливка и подмена, кто-то стучится на сайт дважды
        # в секунду. Так проверяется не намерение, а факт: заливка идёт
        # РЯДОМ и живого сайта не касается, а подмена — одно движение.
        # Каждый ответ записывается как «код + отпечаток содержимого»,
        # поэтому в ряду видно и падения, и момент, когда содержимое
        # сменилось.
        run: |
          cat > /tmp/nablyudenie.sh <<'SH'
          #!/bin/bash
          # Один запрос на строку, а не два: код и тело обязаны быть
          # из ОДНОГО ответа, иначе на самой подмене можно получить
          # код от старого выпуска и тело от нового.
          while :; do
            t=$(date -u +%H:%M:%S.%2N)
            otvet=$(curl -sS --max-time 4 -w '\n%{http_code}' https://neirolavka.ru/ 2>/dev/null) \
              || { echo "$t ОШИБКА"; sleep 0.5; continue; }
            kod=${otvet##*$'\n'}
            telo=${otvet%$'\n'*}
            if   printf '%s' "$telo" | grep -q 'Claude Pro';          then chto=сайт
            elif printf '%s' "$telo" | grep -q 'сайт ещё не выложен'; then chto=заглушка
            else                                                           chto=неизвестно
            fi
            printf '%s %s %s %s\n' "$t" "$kod" "$chto" "${#telo}"
            sleep 0.5
          done
          SH
          chmod +x /tmp/nablyudenie.sh
          nohup /tmp/nablyudenie.sh > /tmp/nablyudenie.log 2>&1 &
          echo $! > /tmp/nablyudenie.pid
          sleep 2
          echo "наблюдение пошло, первые строки:"
          head -3 /tmp/nablyudenie.log

      - name: Заливка рядом с текущим
        if: steps.dostup.outputs.est == 'да'
        # Рядом, а не поверх: пока идёт заливка, current смотрит на
        # прошлый выпуск и человек видит рабочий сайт. Полуразложенной
        # выдачи не бывает по построению.
        env:
          IMYA: ${{ steps.vypusk.outputs.imya }}
        run: |
          if [ "${{ inputs.proba_otkata }}" = "true" ]; then
            echo "::warning::УЧЕНИЕ: порчу выдачу намеренно, чтобы проверить откат."
            printf '<!doctype html><title>сломано</title>учение\n' > out/index.html
            rm -f out/index.html.gz
          fi
          ssh cel "mkdir -p '$KOREN/releases/$IMYA'"
          # Просто `-e ssh`, без -F. Тильда в одинарных кавычках shell'ом
          # не раскрывается, а сам ssh её в аргументе -F не разворачивает:
          # выходило «Can't open user config file ~/.ssh/config» и обрыв
          # соединения. Файл ~/.ssh/config ssh и так читает по умолчанию,
          # так что -F тут был лишним с самого начала.
          rsync -az --delete --chmod=D755,F644 -e ssh \
            out/ "cel:$KOREN/releases/$IMYA/"
          ssh cel "test -s '$KOREN/releases/$IMYA/index.html' \
                   && test -s '$KOREN/releases/$IMYA/404.html' \
                   && test -d '$KOREN/releases/$IMYA/_next/static'"
          echo "залито: $(ssh cel "find '$KOREN/releases/$IMYA' -type f | wc -l") файлов"

      - name: Подмена одним движением
        id: podmena
        if: steps.dostup.outputs.est == 'да'
        env:
          IMYA: ${{ steps.vypusk.outputs.imya }}
        run: |
          # mv -T над символической ссылкой — атомарная операция ядра:
          # промежуточного состояния, в котором current не существует,
          # не бывает. nginx перезагружать не нужно, он разбирает
          # ссылку на каждом запросе.
          ssh cel "
            set -e
            ln -sfn '$KOREN/releases/$IMYA' '$KOREN/.current.new'
            mv -Tf '$KOREN/.current.new' '$KOREN/current'
            readlink -f '$KOREN/current'
          "

      - name: Проверка сразу после подмены
        if: steps.dostup.outputs.est == 'да'
        # Ходим на САМ СЕРВЕР через петлю, но по настоящему имени:
        # --resolve сажает neirolavka.ru на 127.0.0.1, поэтому проверяется
        # то, что отдаёт наш nginx, а не то, что лежит в папке, и не то,
        # куда сейчас смотрит DNS.
        #
        # Раньше здесь стоял голый http://127.0.0.1/ с заголовком Host.
        # Это работало ровно до выпуска сертификата: боевая конфигурация
        # отвечает на http редиректом 301, и проверка искала «Нейролавка»
        # в пустом теле редиректа. Теперь запрос идёт с -L и через оба
        # порта — путь человека воспроизводится целиком, вместе
        # с переходом на https.
        run: |
          ssh cel bash -s -- "$KOREN" <<'SH'
          set -euo pipefail
          KOREN="$1"
          Q=(curl -sS --max-time 10 -L
             --resolve neirolavka.ru:80:127.0.0.1
             --resolve neirolavka.ru:443:127.0.0.1)

          koren=$("${Q[@]}" http://neirolavka.ru/)
          printf '%s' "$koren" | grep -q 'Нейролавка' \
            || { echo '::error::на главной нет слова Нейролавка'; exit 1; }
          printf '%s' "$koren" | grep -q 'Claude Pro' \
            || { echo '::error::на главной нет витрины'; exit 1; }

          kod=$("${Q[@]}" -o /dev/null -w '%{http_code}' http://neirolavka.ru/)
          [ "$kod" = 200 ] || { echo "::error::главная отдала $kod"; exit 1; }

          kusok=$(printf '%s' "$koren" | grep -o '/_next/static/[^"]*\.css' | head -1)
          [ -n "$kusok" ] || { echo '::error::в главной нет ссылки на статику'; exit 1; }
          kkod=$("${Q[@]}" -o /dev/null -w '%{http_code}' "https://neirolavka.ru$kusok")
          [ "$kkod" = 200 ] || { echo "::error::статика $kusok отдала $kkod"; exit 1; }

          n404=$("${Q[@]}" -o /dev/null -w '%{http_code}' https://neirolavka.ru/net-takoy-stranicy/)
          [ "$n404" = 404 ] || { echo "::error::несуществующий адрес отдал $n404"; exit 1; }

          echo "главная 200, статика $kusok 200, несуществующий адрес 404"
          echo "текущий выпуск: $(readlink -f "$KOREN/current")"
          SH

      - name: Наблюдение за непрерывностью — разбор
        if: always() && steps.dostup.outputs.est == 'да' && steps.domen.outputs.nash == 'да'
        run: |
          sleep 2
          kill "$(cat /tmp/nablyudenie.pid)" 2>/dev/null || true
          sleep 1
          echo "── весь ряд наблюдения ──"
          cat /tmp/nablyudenie.log
          echo "── итог ──"
          vsego=$(grep -c . /tmp/nablyudenie.log || echo 0)
          oshibok=$(grep -c 'ОШИБКА' /tmp/nablyudenie.log || true)
          ne200=$(awk '$2 != "200" && $2 != "" {n++} END {print n+0}' /tmp/nablyudenie.log)
          neizv=$(grep -c 'неизвестно' /tmp/nablyudenie.log || true)
          perehodov=$(awk '{if (NR>1 && $3 != p) n++; p=$3} END {print n+0}' /tmp/nablyudenie.log)
          echo "запросов $vsego, ошибок сети $oshibok, ответов не 200: $ne200, неузнанных тел: $neizv"
          echo "смен содержимого за время выкладки: $perehodov"
          # Одна сетевая осечка между двумя разными дата-центрами —
          # это осечка канала, а не сайт. Две подряд — уже сайт.
          if [ "$ne200" -gt 0 ] || [ "$neizv" -gt 0 ] || [ "$oshibok" -gt 1 ]; then
            echo "::error::во время выкладки сайт был недоступен или отдавал не то"
            exit 1
          fi
          if [ "$perehodov" -gt 1 ]; then
            echo "::error::содержимое менялось $perehodov раз — подмена не одним движением"
            exit 1
          fi
          # Ноль смен — это НЕ обязательно хорошо и НЕ обязательно плохо:
          # так бывает и когда выдача побайтово та же (правка одного
          # CLAUDE.md сборку не меняет), и когда прогон не дошёл до
          # подмены. Врать про «ровно на подмене» в этом случае нельзя.
          if [ "$perehodov" -eq 0 ]; then
            echo "сайт не падал ни разу; содержимое ни разу не менялось — либо выдача та же, либо до подмены не дошло"
          else
            echo "сайт не падал ни разу; содержимое сменилось один раз — на подмене"
          fi

      - name: Откат, если проверка не прошла
        # Ровно тогда, когда откатывать есть что: подмена состоялась,
        # а что-то после неё не прошло. Пока условие было просто
        # failure(), шаг срабатывал и на обрыве ещё до подключения —
        # и добавлял к понятной ошибке вторую, непонятную.
        if: failure() && steps.podmena.outcome == 'success'
        env:
          IMYA: ${{ steps.vypusk.outputs.imya }}
        run: |
          ssh cel bash -s -- "$KOREN" "$IMYA" <<'SH'
          set -euo pipefail
          KOREN="$1"; IMYA="$2"
          # Откатываться можно только на ГОДНЫЙ выпуск, а не просто
          # на предыдущий по времени. От упавшей заливки остаётся пустая
          # папка с правильным именем, и откат на неё кладёт сайт
          # насмерть — это уже случилось. Годность решается тем же
          # набором файлов, что проверяет заливка.
          godnyy() {
            [ -s "$1/index.html" ] && [ -s "$1/404.html" ] && [ -d "$1/_next/static" ]
          }
          nashli=
          for d in $(ls -1dt "$KOREN"/releases/*/ 2>/dev/null); do
            d="${d%/}"
            case "$d" in *"$IMYA") continue ;; esac
            if godnyy "$d"; then nashli="$d"; break; fi
            echo "пропускаю негодный выпуск: $d"
          done
          if [ -n "$nashli" ]; then
            ln -sfn "$nashli" "$KOREN/.current.new"
            mv -Tf "$KOREN/.current.new" "$KOREN/current"
            echo "откатились на $(readlink -f "$KOREN/current")"
          else
            echo '::warning::годного прошлого выпуска нет — current оставлен как есть'
          fi
          SH

      - name: Уборка старых выпусков
        if: always() && steps.dostup.outputs.est == 'да'
        run: |
          ssh cel bash -s -- "$KOREN" "$HRANIT" <<'SH'
          set -euo pipefail
          KOREN="$1"; HRANIT="$2"
          cd "$KOREN/releases"
          tek=$(readlink -f "$KOREN/current")
          godnyy() {
            [ -s "$1/index.html" ] && [ -s "$1/404.html" ] && [ -d "$1/_next/static" ]
          }
          # Сначала выносим негодные — пустые папки от упавших заливок.
          # Пока они лежат рядом, откат может выбрать такую и положить сайт.
          for d in */; do
            d="${d%/}"
            [ "$(readlink -f "$d")" = "$tek" ] && continue
            godnyy "$d" || { rm -rf -- "$d"; echo "убран негодный $d"; }
          done
          # Потом лишние по возрасту: держим HRANIT свежих плюс текущий.
          ls -1dt */ | tail -n +$(( HRANIT + 1 )) | while read -r d; do
            d="${d%/}"
            [ "$(readlink -f "$d")" = "$tek" ] && continue
            rm -rf -- "$d"
            echo "убран старый $d"
          done
          echo "осталось выпусков: $(ls -1d */ 2>/dev/null | wc -l), текущий $tek"
          SH

      - name: Проверка боем
        if: steps.dostup.outputs.est == 'да' && steps.domen.outputs.nash == 'да'
        # Обязательна ровно тогда, когда домену есть куда отвечать.
        # До переезда DNS она падала бы не по вине кода.
        run: node scripts/check-live.mjs "$SAYT"
